<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MrCrazy OrderDesk</title>
<style>
  :root {
    --bg:#0f1419; --panel:#1a2332; --line:#334155;
    --text:#e8eef7; --muted:#94a3b8; --green:#0B8457;
    --cream:#f59e0b; --paper:#fffef8; --ink:#111;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  header {
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    padding:10px 14px; background:linear-gradient(90deg,#0B8457,#065f46);
  }
  header h1 { margin:0; font-size:1.05rem; }
  header .sub { opacity:.9; font-size:.8rem; }
  .layout { display:grid; grid-template-columns:300px 1fr; height:calc(100vh - 50px); }
  @media(max-width:960px){ .layout{ grid-template-columns:1fr; height:auto; } }
  .sidebar { background:var(--panel); border-right:1px solid var(--line); padding:12px; overflow:auto; display:flex; flex-direction:column; }
  .main { padding:10px; overflow:auto; background:#121820; }
  label { display:block; font-size:.68rem; color:var(--muted); font-weight:700; letter-spacing:.04em; margin:7px 0 3px; }
  textarea,input,select {
    width:100%; background:#0f1726; border:1px solid var(--line); color:var(--text);
    border-radius:9px; padding:8px 10px; font-size:13px;
  }
  textarea { min-height:120px; resize:vertical; font-family:inherit; }
  button {
    border:0; border-radius:9px; padding:11px 12px; font-weight:700; cursor:pointer;
    color:#fff; background:var(--green); width:100%; margin-top:8px;
  }
  button.secondary { background:#334155; }
  button.amber { background:var(--cream); color:#111; }
  button.red { background:#b91c1c; }
  button.sm { width:auto; margin:0; padding:6px 9px; font-size:12px; }
  .status { font-size:.78rem; color:var(--muted); margin-top:6px; min-height:1.1em; }
  .brand {
    margin-top:auto; padding-top:14px; border-top:1px solid var(--line);
    font-size:.78rem; color:var(--muted); line-height:1.45;
  }
  .brand b { color:#e2e8f0; }
  .brand a { color:#7dd3fc; text-decoration:none; }
  .toolbar,.day-bar,.sheet-tabs { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
  .day-bar { padding:8px 10px; background:var(--panel); border-radius:10px; border:1px solid var(--line); }
  .chip { background:#0f2e1c; color:#4ade80; border-radius:999px; padding:2px 8px; font-size:.72rem; font-weight:700; }
  .sheet-tabs button.active { outline:2px solid #4ade80; }
  .sheet-wrap { display:flex; justify-content:center; }
  .sheet {
    width:100%; max-width:1120px; min-height:min(70vh, 520px);
    background:var(--paper); color:var(--ink); border-radius:3px;
    box-shadow:0 10px 32px rgba(0,0,0,.45);
    display:flex; flex-direction:column; position:relative; overflow:hidden;
  }
  .sheet::before {
    content:""; position:absolute; inset:0; pointer-events:none; opacity:.45;
    background-image:linear-gradient(rgba(0,0,0,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.035) 1px,transparent 1px);
    background-size:18px 18px;
  }
  .sheet-head {
    position:relative; z-index:2;
    display:flex; justify-content:space-between; align-items:center;
    padding:5px 10px; border-bottom:1.5px solid #111; background:#f1f5f9;
    font-weight:800; font-size:.8rem; flex-shrink:0;
  }
  .sheet-shop {
    position:relative; z-index:2;
    text-align:center;
    font-weight:900;
    font-size:1.15rem;
    letter-spacing:.03em;
    padding:6px 10px 4px;
    border-bottom:1.5px solid #111;
    background:#fff;
    color:#0f172a;
  }
  .cols { position:relative; z-index:1; flex:1 1 auto; display:grid; min-height:0; grid-template-columns:1fr; align-content:start; }
  .cols.c1 { grid-template-columns:1fr; }
  .cols.c2 { grid-template-columns:1fr 1fr; }
  .cols.c3 { grid-template-columns:1fr 1fr 1fr; }
  .col { padding:4px 5px; border-right:1.5px solid #222; display:flex; flex-direction:column; gap:2px; min-height:0; justify-content:flex-start; align-content:flex-start; }
  .col:last-child { border-right:0; }
  .col-title {
    text-align:center; font-weight:900; font-size:.75rem; letter-spacing:.04em;
    padding:3px 4px; border:1.5px solid #111; background:#f3f4f6; flex-shrink:0;
  }
  .col.sweets .col-title { background:#ecfdf5; }
  .col.fc .col-title { background:#fff7ed; }
  .col.other .col-title { background:#eff6ff; }
  .list { display:flex; flex-direction:column; gap:2px; flex:0 1 auto; align-content:flex-start; }
  .ticket {
    border:1.5px solid #111; padding:3px 5px; background:#fff; cursor:pointer;
    font-size:.7rem; line-height:1.2;
    flex:0 0 auto;
    max-width:100%;
    margin:0;
  }
  .ticket:hover { box-shadow:inset 0 0 0 1.5px #0B8457; }
  .ticket h4 {
    margin:0 0 1px; font-size:.72rem; border-bottom:1px dashed #777; padding-bottom:1px;
    display:flex; justify-content:space-between; gap:4px;
  }
  .ticket .top { display:grid; grid-template-columns:1fr 1fr; gap:1px 4px; margin:1px 0; }
  .ticket .top div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ticket .top b { font-weight:800; margin-right:3px; }
  .nums { font-variant-numeric:tabular-nums; font-weight:700; direction:ltr; unicode-bidi:embed; }
  .shop-en { font-weight:800; }
  .detail {
    margin-top:1px; font-size:.68rem; line-height:1.22; white-space:pre-wrap;
    direction:rtl; text-align:right;
    font-family:"Noto Nastaliq Urdu","Segoe UI",Tahoma,sans-serif;
  }
  .sheet-foot {
    position:relative; z-index:2; text-align:center;
    font-size:.62rem; color:#64748b; padding:6px 10px 7px;
    border-top:1.5px solid #0f172a; background:linear-gradient(180deg,#f8fafc,#eef2f7);
    flex-shrink:0; line-height:1.4; letter-spacing:.02em;
  }
  .sheet-foot .foot-brand {
    font-weight:800; font-size:.72rem; color:#0f172a;
    letter-spacing:.06em; text-transform:uppercase;
  }
  .sheet-foot .foot-time {
    font-weight:600; color:#475569; font-size:.62rem; margin-top:1px;
    font-variant-numeric:tabular-nums;
  }
  .sheet-foot .ai-line {
    margin-top:4px; padding-top:4px; border-top:1px solid #cbd5e1;
    font-weight:700; font-size:.66rem; color:#0B8457;
    letter-spacing:.03em;
  }
  .sheet-foot .ai-line span {
    display:inline-block; padding:2px 10px; border:1px solid #0B8457;
    border-radius:999px; background:#ecfdf5; color:#065f46;
    font-weight:800; font-size:.64rem; letter-spacing:.04em;
  }
  .sheet-summary {
    position:relative; z-index:2; margin-top:auto; flex-shrink:0;
    border-top:1.5px solid #111; background:#f8fafc; padding:6px 10px;
    font-size:.72rem;
  }
  .sheet-summary h4 { margin:0 0 4px; font-size:.78rem; letter-spacing:.04em; text-align:center; }
  .sum-line { display:flex; gap:6px; margin:1px 0; }
  .sum-line .n { font-weight:800; min-width:1.2em; }
  .sum-total { margin-top:4px; font-weight:800; border-top:1px dashed #999; padding-top:3px; text-align:center; }
  .empty-sheet {
    flex:1; display:flex; align-items:center; justify-content:center;
    color:#999; font-style:italic; font-size:.85rem; position:relative; z-index:1;
  }
  .modal-bg {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:50;
    align-items:center; justify-content:center; padding:14px;
  }
  .modal-bg.show { display:flex; }
  .modal {
    background:#1a2332; border:1px solid var(--line); border-radius:12px;
    padding:14px; width:100%; max-width:420px; color:var(--text);
  }
  .modal h3 { margin:0 0 6px; }
  .modal .row { display:flex; gap:8px; margin-top:10px; }
  .modal .row button { flex:1; }
  @page { size: A4 landscape; margin: 8mm; }
  @media print {
    body { background:#fff; }
    header,.sidebar,.toolbar,.day-bar,.sheet-tabs,.status,.modal-bg { display:none !important; }
    .layout { display:block; height:auto; }
    .main { padding:0; background:#fff; overflow:visible; }
    .sheet-wrap { display:block; }
    .sheet {
      box-shadow:none; max-width:100%; width:100%;
      aspect-ratio:auto; min-height:auto;
      height:auto;
      page-break-after:always; break-after:page;
    }
    .sheet:last-child { page-break-after:auto; break-after:auto; }
    .ticket { flex:0 0 auto; }
    .list { flex:0 1 auto; }
    .sheet-summary { margin-top:12px; }
    .ticket { cursor:default; break-inside:avoid; }
    .ticket:hover { box-shadow:none; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>MrCrazy OrderDesk</h1>
    <div class="sub">Online · Firebase AI key · Landscape sheets</div>
  </div>
  <div class="chip" id="todayChip">Today</div>
</header>

<div class="layout">
  <aside class="sidebar">
    <label>DATE</label>
    <input type="date" id="dayDate"/>
    <label>MAX ORDERS PER SHEET</label>
    <select id="maxOrders">
      <option value="6">6</option>
      <option value="8">8</option>
      <option value="10" selected>10</option>
    </select>
    <label>ORDER</label>
    <textarea id="raw" placeholder="Paste & write here Order"></textarea>
    <button onclick="aiAdd()">MrCrazy Ai Order Add</button>
    <div style="display:flex;gap:6px">
      <button class="secondary" style="flex:1" onclick="addManual('sweets')">+ Sweets</button>
      <button class="secondary" style="flex:1" onclick="addManual('fc')">+ F.C.</button>
      <button class="secondary" style="flex:1" onclick="addManual('other')">+ Other</button>
    </div>
    <button class="secondary" onclick="newSheet()">+ New sheet</button>
    <button class="red" onclick="clearDay()">Is din clear</button>
    <div class="status" id="status"></div>
    <div class="brand">
      <b>Created by Muhammad Naeem</b><br/>
      MrCrazy Digital Company<br/>
      <a href="tel:03257436319">03257436319</a><br/>
      <a href="https://mrcrazydev.netlify.app/" target="_blank" rel="noopener">mrcrazydev.netlify.app</a>
    </div>
  </aside>

  <main class="main">
    <div class="day-bar">
      <strong id="dayLabel">—</strong>
      <span class="chip" id="sheetCount">1 sheet</span>
      <span style="color:var(--muted);font-size:.78rem" id="ticketCount">0</span>
    </div>
    <div class="sheet-tabs" id="sheetTabs"></div>
    <div class="toolbar">
      <button class="amber sm" onclick="printMode('all')">Print All</button>
      <button class="secondary sm" onclick="printMode('fc')">Print F.C. only</button>
      <button class="secondary sm" onclick="printMode('other')">Print Other only</button>
      <button class="secondary sm" onclick="printMode('sweets')">Print Sweets only</button>
      <button class="secondary sm" onclick="printCurrent()">Print current sheet</button>
      <button class="secondary sm" onclick="exportDay()">Export</button>
    </div>
    <div class="sheet-wrap" id="printArea"><div class="sheet" id="sheet"></div></div>
  </main>
</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h3>Edit ticket</h3>
    <label>Shop (English)</label><input id="eShop"/>
    <label>Name</label><input id="eName"/>
    <label>Qty</label><input id="eQty"/>
    <label>Flavour</label><input id="eFlavour"/>
    <label>Tafseel / Note</label><textarea id="eDetail" style="min-height:90px"></textarea>
    <div class="row">
      <button class="secondary" onclick="closeModal()">Cancel</button>
      <button class="red" onclick="deleteTicket()">Delete</button>
      <button onclick="saveTicket()">Save</button>
    </div>
  </div>
</div>

<script>
const LS_KEY = "orderdesk_v5";
const DB = "https://website-create-ec499-default-rtdb.firebaseio.com";
const CFG_URL = DB + "/orderdesk_config.json";
const DEFAULT_MODEL = "openai/gpt-oss-120b";

function $(id){ return document.getElementById(id); }
function setStatus(t){ $("status").textContent = t || ""; }
function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let db = loadDb();
let day = todayStr();
let sheetIndex = 0;
let editRef = null;
let cachedKey = "";
let cachedModel = DEFAULT_MODEL;

$("dayDate").value = day;
$("dayDate").onchange = () => { day = $("dayDate").value || todayStr(); sheetIndex = 0; loadDayOnline(); };
$("maxOrders").value = localStorage.getItem("od_max") || "10";
$("maxOrders").onchange = () => localStorage.setItem("od_max", $("maxOrders").value);

function maxPerSheet(){ return Number($("maxOrders").value || 10); }
function loadDb(){ try { return JSON.parse(localStorage.getItem(LS_KEY)||"{}"); } catch(e){ return {}; } }
function saveDbLocal(){ localStorage.setItem(LS_KEY, JSON.stringify(db)); }
function emptySheet(){ return { sweets:[], fc:[], other:[] }; }

function ensureDayLocal(){
  if (!db[day]) db[day] = { sheets:[ emptySheet() ] };
  if (!db[day].sheets || !db[day].sheets.length) db[day].sheets = [ emptySheet() ];
  db[day].sheets.forEach(s => {
    if (!s.sweets) s.sweets = [];
    if (!s.fc) s.fc = [];
    if (!s.other) s.other = [];
  });
  if (sheetIndex >= db[day].sheets.length) sheetIndex = Math.max(0, db[day].sheets.length-1);
}
function ensureDay(){ ensureDayLocal(); saveDbLocal(); }
function saveDb(){
  ensureDayLocal();
  saveDbLocal();
  saveDayOnline();
}
async function saveDayOnline(){
  try {
    const payload = { sheets: db[day].sheets, updatedAt: Date.now() };
    await fetch(DB + "/orderdesk_days/" + encodeURIComponent(day) + ".json", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
  } catch(e) { console.warn("online save", e); }
}
async function loadDayOnline(){
  setStatus("Loading…");
  try {
    const r = await fetch(DB + "/orderdesk_days/" + encodeURIComponent(day) + ".json?t=" + Date.now());
    if (r.ok) {
      const j = await r.json();
      if (j && Array.isArray(j.sheets) && j.sheets.length) {
        db[day] = { sheets: j.sheets };
        sheetIndex = 0;
        saveDbLocal();
        setStatus("Online data loaded · " + day);
        render();
        return;
      }
    }
  } catch(e) { console.warn(e); }
  ensureDayLocal();
  setStatus("Local / empty · " + day);
  render();
}
function curSheet(){ ensureDayLocal(); return db[day].sheets[sheetIndex]; }
function sheetTotal(s){ return (s.sweets||[]).length + (s.fc||[]).length + (s.other||[]).length; }

function newSheet(){
  ensureDayLocal();
  db[day].sheets.push(emptySheet());
  sheetIndex = db[day].sheets.length-1;
  saveDb(); render();
  setStatus("New sheet");
}
function clearDay(){
  if (!confirm("Is din ki sari sheets clear?")) return;
  db[day] = { sheets:[ emptySheet() ] }; sheetIndex = 0; saveDb(); render();
}

async function fetchApiKey(){
  if (cachedKey) return cachedKey;
  const r = await fetch(CFG_URL + "?t=" + Date.now());
  if (!r.ok) throw new Error("Config load failed " + r.status);
  const j = await r.json();
  if (!j || !j.groqKey) throw new Error("Admin ne API key set nahi ki");
  cachedKey = String(j.groqKey).trim();
  if (j.model) cachedModel = String(j.model).trim() || DEFAULT_MODEL;
  return cachedKey;
}

function ticketHtml(o, i, side){
  const prefix = side==="fc" ? "F.C. " : side==="other" ? "O " : "S ";
  const flav = o.flavour ? `<div><b>Flav</b> ${esc(o.flavour)}</div>` : "";
  const rate = o.rateNote ? `<div><b>Rate</b> ${esc(o.rateNote)}</div>` : "";
  // Name: cake name preferred, else customer name — same line style as other fields
  let nameVal = "";
  if (o.nameOnCakeEn || o.nameOnCakeUr) {
    nameVal = [o.nameOnCakeEn, o.nameOnCakeUr].filter(Boolean).join(" / ");
  } else {
    nameVal = o.customerName || "—";
  }
  return `<div class="ticket" onclick="openEdit('${side}',${i})">
    <h4><span>${esc(prefix+(i+1))}</span><span class="nums">${esc(o.qty||"")}</span></h4>
    <div class="top">
      <div style="grid-column:1/-1"><b>Shop.</b> <span class="shop-en" style="font-size:0.95rem">${esc(o.shopName||"—")}</span></div>
      <div style="grid-column:1/-1"><b>Name.</b> ${esc(nameVal)}</div>
      ${flav}
      ${rate}
    </div>
    <div class="detail">${esc(o.detailUrdu||"")}</div>
  </div>`;
}
function colHtml(title, side, list, cls){
  if (!list.length) return "";
  return `<div class="col ${cls}">
    <div class="col-title">${esc(title)}</div>
    <div class="list">${list.map((o,i)=>ticketHtml(o,i,side)).join("")}</div>
  </div>`;
}
function primaryShops(s){
  const names = [];
  [...s.fc, ...s.sweets, ...s.other].forEach(o => {
    const n = (o.shopName || "").trim();
    if (n && n !== "—" && !names.includes(n)) names.push(n);
  });
  return names.slice(0, 6).join(" · ");
}

/** Shop-wise totals for current sheet (and label type). */
function shopSummary(s){
  const map = {};
  function add(list, type){
    list.forEach(o => {
      const name = (o.shopName || "—").trim() || "—";
      if (!map[name]) map[name] = { sweets:0, fc:0, other:0 };
      map[name][type]++;
    });
  }
  add(s.sweets||[], "sweets");
  add(s.fc||[], "fc");
  add(s.other||[], "other");
  return map;
}

function summaryHtml(s){
  const map = shopSummary(s);
  const keys = Object.keys(map);
  if (!keys.length) return "";
  let total = 0;
  const lines = keys.map((name, i) => {
    const m = map[name];
    const parts = [];
    if (m.sweets) parts.push("Sweet " + m.sweets);
    if (m.fc) parts.push("F.C. " + m.fc);
    if (m.other) parts.push("Other " + m.other);
    const c = m.sweets + m.fc + m.other;
    total += c;
    return `<div class="sum-line"><span class="n">${i+1}.</span><span>${esc(name)} — ${esc(parts.join(", "))}</span></div>`;
  }).join("");
  return `<div class="sheet-summary">
    <h4>TOTAL ORDERS · SHOP WISE</h4>
    ${lines}
    <div class="sum-total">Total shops: ${keys.length} · Total orders: ${total}</div>
  </div>`;
}

function filterSheet(s, mode){
  if (!mode || mode === "all") return { sweets:s.sweets||[], fc:s.fc||[], other:s.other||[] };
  return {
    sweets: mode === "sweets" ? (s.sweets||[]) : [],
    fc: mode === "fc" ? (s.fc||[]) : [],
    other: mode === "other" ? (s.other||[]) : []
  };
}

function buildSheetHtml(s, idx, totalSheets, mode){
  const f = filterSheet(s, mode || "all");
  const parts = [];
  if (f.sweets.length) parts.push(colHtml("SWEETS ORDER", "sweets", f.sweets, "sweets"));
  if (f.fc.length) parts.push(colHtml("F.C. ORDER", "fc", f.fc, "fc"));
  if (f.other.length) parts.push(colHtml("OTHER / NOTE", "other", f.other, "other"));
  const n = parts.length;
  const colsClass = n <= 1 ? "c1" : n === 2 ? "c2" : "c3";
  const body = n
    ? `<div class="cols ${colsClass}">${parts.join("")}</div>`
    : `<div class="empty-sheet">No orders on this sheet</div>`;
  const shops = primaryShops(f);
  const shopLine = shops
    ? `<div class="sheet-shop">${esc(shops)}</div>`
    : "";
  /* Summary only when empty space / at least 1 order — sits under tickets */
  const sum = (sheetTotal(f) > 0) ? summaryHtml(f) : "";
  const modeTag = (!mode || mode === "all") ? "" : " · " + String(mode).toUpperCase();
  const now = new Date();
  const stamp = day + " · " + now.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
  return `<div class="sheet">
    <div class="sheet-head">
      <span>Sheet ${idx+1} / ${totalSheets}${modeTag}</span>
      <span>${esc(day)}</span>
    </div>
    ${shopLine}
    ${body}
    ${sum}
    <div class="sheet-foot">
      <div class="foot-brand">MrCrazy Digital Company</div>
      <div class="foot-time">${esc(stamp)} &nbsp;·&nbsp; Developed by Muhammad Naeem</div>
      <div class="ai-line"><span>This order was generated automatically by MrCrazy AI</span></div>
    </div>
  </div>`;
}

function render(){
  ensureDay();
  const sheets = db[day].sheets;
  const max = maxPerSheet();
  $("dayLabel").textContent = "Date: " + day;
  $("todayChip").textContent = day === todayStr() ? "Today" : day;
  $("sheetCount").textContent = sheets.length + " sheet" + (sheets.length>1?"s":"");
  let total = 0; sheets.forEach(s => total += sheetTotal(s));
  $("ticketCount").textContent = sheetTotal(curSheet()) + " / " + max + " · day " + total;
  const tabs = $("sheetTabs"); tabs.innerHTML = "";
  sheets.forEach((_,i)=>{
    const b = document.createElement("button");
    b.className = "secondary sm" + (i===sheetIndex?" active":"");
    b.textContent = "Sheet " + (i+1);
    b.onclick = () => { sheetIndex=i; render(); };
    tabs.appendChild(b);
  });
  $("printArea").innerHTML = buildSheetHtml(curSheet(), sheetIndex, sheets.length);
}

function openEdit(side,i){
  editRef = { side, i };
  const o = curSheet()[side][i];
  $("eShop").value = o.shopName||"";
  $("eName").value = o.customerName||"";
  $("eQty").value = o.qty||"";
  $("eFlavour").value = o.flavour||"";
  $("eDetail").value = o.detailUrdu||"";
  $("modal").classList.add("show");
}
function closeModal(){ $("modal").classList.remove("show"); editRef=null; }
function saveTicket(){
  if (!editRef) return;
  const o = curSheet()[editRef.side][editRef.i];
  o.shopName=$("eShop").value.trim();
  o.customerName=$("eName").value.trim();
  o.qty=$("eQty").value.trim();
  o.flavour=$("eFlavour").value.trim();
  o.detailUrdu=$("eDetail").value.trim();
  saveDb(); closeModal(); render(); setStatus("Saved");
}
function deleteTicket(){
  if (!editRef || !confirm("Delete?")) return;
  curSheet()[editRef.side].splice(editRef.i,1);
  saveDb(); closeModal(); render();
}

function placeOrder(item, side){
  ensureDay();
  const max = maxPerSheet();
  if (!["sweets","fc","other"].includes(side)) side = "other";
  let s = curSheet();
  if (sheetTotal(s) >= max) { newSheet(); s = curSheet(); }
  s[side].push(item);
  saveDb();
}
function normalize(o, type){
  return {
    shopName: o.shopName || "—",
    customerName: o.customerName || "—",
    nameOnCakeEn: o.nameOnCakeEn || "",
    nameOnCakeUr: o.nameOnCakeUr || "",
    qty: o.qty || "—",
    flavour: o.flavour || "",
    rateNote: o.rateNote || "",
    detailUrdu: o.detailUrdu || "",
    type: o.type || type
  };
}
function addManual(side){
  const shop = prompt("Shop (English):",""); if (shop===null) return;
  const name = prompt("Name:","");
  const qty = prompt("Qty:", side==="other" ? "—" : "1 kg");
  const flavour = side==="other" ? "" : (prompt("Flavour:","")||"");
  const detail = prompt(side==="other" ? "Special note:" : "Tafseel Urdu:","")||"";
  placeOrder(normalize({ shopName:shop, customerName:name, qty, flavour, detailUrdu:detail }, side), side);
  render();
}

const SYSTEM = `You are bakery order desk AI for Pakistan (Hafiz-style order slips).
User text may be Roman Urdu, Urdu, or English. Understand meaning.

Return ONLY JSON:
{
  "orders": [
    {
      "side": "fc" | "sweets" | "other",
      "shopName": "English",
      "customerName": "",
      "nameOnCakeEn": "",
      "nameOnCakeUr": "",
      "qty": "4 Pound",
      "flavour": "",
      "rateNote": "",
      "detailUrdu": "only what customer said"
    }
  ]
}

RULES:
1) Shop name is often written FIRST. ALWAYS fill shopName (English transliteration). Never leave shopName empty if any shop is mentioned. Also put shop clearly so ticket shows Shop. line.
2) detailUrdu: write ONLY what the customer said, in clear Urdu lines. Do NOT add extra company padding, extra steps, or invented details.
3) First detail line = quantity if given (e.g. 4 Pound cake).
4) Name on cake: full name as customer wrote — nameOnCakeEn + nameOnCakeUr. Do not shorten long names.
5) Butter cake/cream → flavour Butter + rateNote "Rate Rs.1500 per pound" and one detail line for rate only if butter.
6) side: fc = cream/F.C./butter cream cake; sweets = mithai; other = jam/note/misc.
7) Keep detailUrdu short and faithful — no more text than needed to reflect the order.
`;

async function aiAdd(){
  const raw = $("raw").value.trim();
  if (!raw) return setStatus("Paste & write order");
  setStatus("Loading AI key…");
  try {
    const key = await fetchApiKey();
    setStatus("MrCrazy AI…");
    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+key },
      body: JSON.stringify({
        model: cachedModel || DEFAULT_MODEL,
        temperature: 0.15,
        max_tokens: 1400,
        messages: [
          { role:"system", content: SYSTEM },
          { role:"user", content: raw }
        ]
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || ("HTTP "+res.status));
    let text = (data.choices?.[0]?.message?.content||"").trim()
      .replace(/^```json/i,"").replace(/^```/,"").replace(/```$/,"").trim();
    const parsed = JSON.parse(text);
    const list = Array.isArray(parsed.orders) ? parsed.orders : [];
    list.forEach(o => {
      let side = (o.side||"").toLowerCase();
      if (side !== "fc" && side !== "sweets" && side !== "other") {
        if (/cream|f\.?c/i.test(o.type||"")) side = "fc";
        else if (/jam|note|other|special/i.test(o.type||o.detailUrdu||"")) side = "other";
        else side = "sweets";
      }
      placeOrder(normalize(o, side), side);
    });
    $("raw").value = "";
    render();
    setStatus("Added");
  } catch(e) {
    cachedKey = "";
    setStatus("Error: " + (e.message||e));
  }
}

function printCurrent(){ window.print(); }

/** mode: all | fc | other | sweets — alag print ya ikhatta */
function printMode(mode){
  ensureDayLocal();
  const area = $("printArea");
  const all = db[day].sheets || [];
  const filtered = [];
  all.forEach(s => {
    const f = filterSheet(s, mode);
    if (sheetTotal(f) > 0) filtered.push(f);
  });
  if (!filtered.length) {
    setStatus("Is filter me koi order nahi · " + mode);
    return;
  }
  area.innerHTML = filtered.map((s,i)=>buildSheetHtml(s, i, filtered.length, mode)).join("");
  setTimeout(() => {
    window.print();
    render();
  }, 120);
}

function printDay(){ printMode("all"); }
function exportDay(){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(db[day],null,2)],{type:"application/json"}));
  a.download = "orders-"+day+".json"; a.click();
}
