<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MrCrazy OrderDesk</title>
<style>
  :root {
    --bg:#0b1220; --panel:#111a2b; --line:#2a3a55;
    --text:#e8eef7; --muted:#94a3b8; --green:#0B8457;
    --cream:#f59e0b; --paper:#fffefb; --ink:#0f172a;
    --accent:#38bdf8;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  header {
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    padding:10px 14px; background:linear-gradient(90deg,#0B8457,#065f46);
  }
  header h1 { margin:0; font-size:1.05rem; }
  header .sub { opacity:.9; font-size:.8rem; }
  .layout { display:grid; grid-template-columns:300px 1fr; height:calc(100vh - 50px); }
  @media(max-width:960px){ .layout{ grid-template-columns:1fr; height:auto; } }
  .sidebar { background:var(--panel); border-right:1px solid var(--line); padding:12px; overflow:auto; display:flex; flex-direction:column; }
  .main { padding:10px; overflow:auto; background:#121820; }
  label { display:block; font-size:.68rem; color:var(--muted); font-weight:700; letter-spacing:.04em; margin:7px 0 3px; }
  textarea,input,select {
    width:100%; background:#0f1726; border:1px solid var(--line); color:var(--text);
    border-radius:9px; padding:8px 10px; font-size:13px;
  }
  textarea { min-height:120px; resize:vertical; font-family:inherit; }
  button {
    border:0; border-radius:9px; padding:11px 12px; font-weight:700; cursor:pointer;
    color:#fff; background:var(--green); width:100%; margin-top:8px;
  }
  button.secondary { background:#334155; }
  button.amber { background:var(--cream); color:#111; }
  button.red { background:#b91c1c; }
  button.sm { width:auto; margin:0; padding:6px 9px; font-size:12px; }
  .status { font-size:.78rem; color:var(--muted); margin-top:6px; min-height:1.1em; }
  .brand {
    margin-top:auto; padding-top:14px; border-top:1px solid var(--line);
    font-size:.78rem; color:var(--muted); line-height:1.45;
  }
  .brand b { color:#e2e8f0; }
  .brand a { color:#7dd3fc; text-decoration:none; }
  .toolbar,.day-bar,.sheet-tabs { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
  .day-bar { padding:8px 10px; background:var(--panel); border-radius:10px; border:1px solid var(--line); }
  .chip { background:#0f2e1c; color:#4ade80; border-radius:999px; padding:2px 8px; font-size:.72rem; font-weight:700; }
  .sheet-tabs button.active { outline:2px solid #4ade80; }
  .sheet-wrap { display:flex; justify-content:center; }
  .sheet {
    width:100%; max-width:1120px; min-height:min(70vh, 520px);
    background:linear-gradient(180deg,#fffefb 0%,#f8fafc 100%);
    color:var(--ink); border-radius:4px;
    border:1px solid #cbd5e1;
    box-shadow:0 12px 36px rgba(0,0,0,.4);
    display:flex; flex-direction:column; position:relative; overflow:hidden;
  }
  .sheet::before {
    content:""; position:absolute; inset:0; pointer-events:none; opacity:.45;
    background-image:linear-gradient(rgba(0,0,0,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.035) 1px,transparent 1px);
    background-size:18px 18px;
  }
  .sheet-head {
    position:relative; z-index:2;
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    padding:5px 10px; border-bottom:1.5px solid #111; background:#f1f5f9;
    font-weight:800; font-size:.8rem; flex-shrink:0;
  }
  .sheet-head .h-left { text-align:left; }
  .sheet-head .h-center { text-align:center; font-size:.85rem; letter-spacing:.04em; }
  .sheet-head .h-right { text-align:right; font-size:.72rem; color:#333; }
  .sheet-shop {
    position:relative; z-index:2;
    text-align:center;
    font-weight:900;
    font-size:1.15rem;
    letter-spacing:.03em;
    padding:6px 10px 4px;
    border-bottom:1.5px solid #111;
    background:#fff;
    color:#0f172a;
  }
  .cols { position:relative; z-index:1; flex:1 1 auto; display:grid; min-height:0; grid-template-columns:1fr; align-content:start; }
  .cols.c1 { grid-template-columns:minmax(0,520px); justify-content:start; }
  .cols.c2 { grid-template-columns:1fr 1fr; }
  .cols.c3 { grid-template-columns:1fr 1fr 1fr; }
  .col { padding:4px 5px; border-right:1.5px solid #222; display:flex; flex-direction:column; gap:2px; min-height:0; justify-content:flex-start; align-content:flex-start; }
  .col:last-child { border-right:0; }
  .col-title {
    text-align:center; font-weight:900; font-size:.78rem; letter-spacing:.08em;
    padding:4px 4px; border:1.5px solid #0f172a; background:#f1f5f9; flex-shrink:0;
    text-transform:uppercase; color:#0f172a;
  }
  .col.sweets .col-title { background:#d1fae5; }
  .col.fc .col-title { background:#ffedd5; }
  .col.other .col-title { background:#dbeafe; }
  .list {
    display:flex; flex-direction:column; gap:4px;
    flex:0 1 auto; align-content:flex-start; align-items:stretch;
    max-width:540px;
  }
  .ticket {
    border:1.5px solid #1e293b; border-radius:2px;
    padding:5px 7px 6px; background:#fff; cursor:pointer;
    font-size:.72rem; line-height:1.35;
    flex:0 0 auto; width:100%; max-width:540px;
    margin:0; box-shadow:0 1px 0 rgba(15,23,42,.04);
  }
  .ticket:hover { box-shadow:inset 0 0 0 1.5px #0B8457; }
  .ticket .t-head {
    display:grid; grid-template-columns:auto 1fr auto;
    align-items:center; gap:6px;
    border-bottom:1.5px solid #0f172a; padding-bottom:3px; margin-bottom:3px;
    font-weight:800; font-size:.72rem;
  }
  .ticket .t-no { font-weight:700; color:#64748b; white-space:nowrap; font-size:.62rem; }
  .ticket .t-shop {
    text-align:center; font-weight:900; font-size:.88rem;
    color:#0f172a; letter-spacing:.02em;
    overflow-wrap:anywhere; word-break:break-word; white-space:normal;
    line-height:1.2;
  }
  .ticket .t-qty { font-weight:900; white-space:nowrap; text-align:right; }
  .ticket .t-line {
    margin:1px 0; padding:0; line-height:1.35;
    overflow-wrap:anywhere; word-break:break-word; white-space:normal;
  }
  .ticket .t-line b { font-weight:800; margin-right:4px; color:#334155; }
  .nums { font-variant-numeric:tabular-nums; font-weight:900; direction:ltr; unicode-bidi:embed; }
  .shop-en { font-weight:900; }
  .detail {
    margin-top:3px; font-size:.78rem; line-height:1.4; white-space:pre-wrap;
    font-weight:650;
    direction:rtl; text-align:right;
    font-family:"Noto Nastaliq Urdu","Segoe UI",Tahoma,sans-serif;
    border-top:1px dashed #94a3b8; padding-top:3px;
    color:#0f172a;
    overflow-wrap:anywhere; word-break:break-word;
  }
  .sheet-foot {
    position:relative; z-index:2; text-align:center;
    font-size:.62rem; color:#64748b; padding:6px 10px 7px;
    border-top:1.5px solid #0f172a; background:linear-gradient(180deg,#f8fafc,#eef2f7);
    flex-shrink:0; line-height:1.4; letter-spacing:.02em;
  }
  .sheet-foot .foot-brand {
    font-weight:800; font-size:.72rem; color:#0f172a;
    letter-spacing:.06em; text-transform:uppercase;
  }
  .sheet-foot .foot-time {
    font-weight:600; color:#475569; font-size:.62rem; margin-top:1px;
    font-variant-numeric:tabular-nums;
  }
  .sheet-foot .ai-line {
    margin-top:4px; padding-top:4px; border-top:1px solid #cbd5e1;
    font-weight:700; font-size:.66rem; color:#0B8457;
    letter-spacing:.03em;
  }
  .sheet-foot .ai-line span {
    display:inline-block; padding:2px 10px; border:1px solid #0B8457;
    border-radius:999px; background:#ecfdf5; color:#065f46;
    font-weight:800; font-size:.64rem; letter-spacing:.04em;
  }
  .null-block {
    position:relative; z-index:2; margin-top:8px; flex-shrink:0;
    border:1.5px solid #b91c1c; background:#fef2f2; padding:5px 8px;
    font-size:.72rem;
  }
  .null-block h4 {
    margin:0 0 3px; font-size:.78rem; letter-spacing:.06em; text-align:center;
    color:#991b1b; font-weight:900;
  }
  .null-block .null-name {
    font-weight:700; color:#7f1d1d; padding:1px 0;
    border-bottom:1px dashed #fca5a5;
  }
  .null-block .null-name:last-child { border-bottom:0; }
  .sheet-summary {
    position:relative; z-index:2; margin-top:auto; flex-shrink:0;
    border-top:1.5px solid #111; background:#f8fafc; padding:6px 10px;
    font-size:.72rem;
  }
  .sheet-summary h4 { margin:0 0 4px; font-size:.78rem; letter-spacing:.04em; text-align:center; }
  .sum-line { display:flex; gap:6px; margin:1px 0; }
  .sum-line .n { font-weight:800; min-width:1.2em; }
  .sum-total { margin-top:4px; font-weight:800; border-top:1px dashed #999; padding-top:3px; text-align:center; }
  .empty-sheet {
    flex:1; display:flex; align-items:center; justify-content:center;
    color:#999; font-style:italic; font-size:.85rem; position:relative; z-index:1;
  }
  .modal-bg {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:50;
    align-items:center; justify-content:center; padding:14px;
  }
  .modal-bg.show { display:flex; }
  .modal {
    background:#1a2332; border:1px solid var(--line); border-radius:12px;
    padding:14px; width:100%; max-width:420px; color:var(--text);
  }
  .modal h3 { margin:0 0 6px; }
  .modal .row { display:flex; gap:8px; margin-top:10px; }
  .modal .row button { flex:1; }

  .popup-bg {
    display:none; position:fixed; inset:0; z-index:100;
    background:rgba(2,6,23,.72); align-items:center; justify-content:center; padding:16px;
  }
  .popup-bg.show { display:flex; }
  .popup {
    background:#0f172a; border:1px solid #334155; border-radius:16px;
    padding:18px 18px 14px; max-width:420px; width:100%;
    box-shadow:0 24px 60px rgba(0,0,0,.55); color:var(--text); text-align:center;
  }
  .popup h3 { margin:0 0 8px; font-size:1.05rem; }
  .popup p { margin:0 0 14px; color:var(--muted); font-size:.9rem; line-height:1.45; }
  .popup .prow { display:flex; gap:8px; justify-content:center; }
  .popup .prow button { width:auto; min-width:110px; margin:0; }
  .menu-btn {
    width:40px; height:40px; border-radius:12px; border:1px solid var(--line);
    background:#1a2740; color:#fff; font-size:18px; font-weight:900; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0; margin:0;
  }
  .drawer-bg {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:80;
  }
  .drawer-bg.show { display:block; }
  .drawer {
    position:fixed; top:0; right:-320px; width:300px; height:100%;
    background:#0f172a; border-left:1px solid var(--line); z-index:90;
    transition:right .25s ease; padding:16px 14px; overflow:auto;
  }
  .drawer.open { right:0; }
  .drawer h3 { margin:0 0 12px; font-size:1rem; }
  .drawer button { margin-top:8px; }
  .qty-hl {
    display:inline-block; background:#fef08a; color:#713f12;
    font-weight:900; padding:1px 6px; border-radius:4px;
    border:1px solid #eab308;
  }
  .t-delivery {
    margin-top:2px; font-size:.72rem; font-weight:800; color:#9a3412;
    background:#ffedd5; border:1px solid #fdba74; border-radius:4px;
    padding:2px 6px; display:inline-block;
  }
  .pending-banner {
    position:relative; z-index:3;
    margin:8px 0; padding:10px 12px;
    background:linear-gradient(90deg,#fef3c7,#ffedd5);
    border:1.5px solid #d97706; border-radius:10px;
    color:#78350f; font-weight:700; font-size:.85rem;
    display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between;
  }
  .pending-banner button { width:auto; margin:0; padding:8px 12px; background:#b45309; }
  .special-note-box {
    position:relative; z-index:2; margin:8px 10px; flex-shrink:0;
    border:2px solid #0B8457; border-radius:8px;
    background:linear-gradient(135deg,#ecfdf5 0%,#f0fdf4 50%,#fff 100%);
    padding:8px 12px; box-shadow:inset 0 0 0 1px rgba(11,132,87,.15);
  }
  .special-note-box h4 {
    margin:0 0 4px; text-align:center; font-size:.8rem; letter-spacing:.08em;
    color:#065f46; font-weight:900; text-transform:uppercase;
  }
  .special-note-box .sn-body {
    direction:rtl; text-align:right; font-size:.85rem; line-height:1.45; font-weight:650;
    color:#0f172a; white-space:pre-wrap;
    font-family:"Noto Nastaliq Urdu","Segoe UI",Tahoma,sans-serif;
    min-height:1.2em;
  }
  .ticket .t-when {
    margin-top:3px; padding-top:3px; border-top:1.5px solid #0f172a;
    text-align:right; font-weight:900; font-size:.68rem;
    color:#0f172a; letter-spacing:.02em;
  }
  .audit-list { max-height:280px; overflow:auto; font-size:.78rem; }
  .audit-row {
    border:1px solid var(--line); border-radius:8px; padding:8px; margin-bottom:6px;
    background:#0f1726;
  }
  .audit-row b { color:#4ade80; }

  @page { size: A4 landscape; margin: 6mm; }
  @media print {
    * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
    body { background:#fff; }
    header,.sidebar,.toolbar,.day-bar,.sheet-tabs,.status,.modal-bg,.pending-banner,#slotBar { display:none !important; }
    .layout { display:block; height:auto; }
    .main { padding:0; background:#fff; overflow:visible; }
    .sheet-wrap { display:block; }
    .sheet {
      box-shadow:none; max-width:100%; width:100%;
      aspect-ratio:auto; min-height:auto;
      height:auto;
      page-break-after:always; break-after:page;
    }
    .sheet:last-child { page-break-after:auto; break-after:auto; }
    .ticket { flex:0 0 auto; }
    .list { flex:0 1 auto; }
    .null-block {
    position:relative; z-index:2; margin-top:8px; flex-shrink:0;
    border:1.5px solid #b91c1c; background:#fef2f2; padding:5px 8px;
    font-size:.72rem;
  }
  .null-block h4 {
    margin:0 0 3px; font-size:.78rem; letter-spacing:.06em; text-align:center;
    color:#991b1b; font-weight:900;
  }
  .null-block .null-name {
    font-weight:700; color:#7f1d1d; padding:1px 0;
    border-bottom:1px dashed #fca5a5;
  }
  .null-block .null-name:last-child { border-bottom:0; }
  .sheet-summary { margin-top:12px; }
    .ticket { cursor:default; break-inside:avoid; }
    .ticket:hover { box-shadow:none; }
  }
</style>
</head>
<body>
<header>
  <div>

  </div>
  <div style="display:flex;align-items:center;gap:8px">

      <b>About</b><br/>

      <a href="tel:03257436319">03257436319</a><br/>

      <a href="https://mrcrazydev.netlify.app/" target="_blank" rel="noopener">mrcrazydev.netlify.app</a>

<script>
const LS_KEY = "orderdesk_v7";
const DB = "https://website-create-ec499-default-rtdb.firebaseio.com";
const CFG_URL = DB + "/orderdesk_config.json";
const DEFAULT_MODEL = "openai/gpt-oss-120b";

function $(id){ return document.getElementById(id); }
function setStatus(t){ $("status").textContent = t || ""; }
function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function popup(title, msg, opts){
  return new Promise(resolve => {
    const bg = document.createElement("div");
    bg.className = "popup-bg show";
    const ok = (opts && opts.ok) || "OK";
    const cancel = opts && opts.cancel;
    bg.innerHTML = `<div class="popup"><h3>${esc(title)}</h3><p>${esc(msg)}</p><div class="prow"></div></div>`;
    const row = bg.querySelector(".prow");
    const b1 = document.createElement("button");
    b1.textContent = ok;
    b1.onclick = () => { bg.remove(); resolve(true); };
    row.appendChild(b1);
    if (cancel) {
      const b2 = document.createElement("button");
      b2.className = "secondary";
      b2.textContent = cancel;
      b2.onclick = () => { bg.remove(); resolve(false); };
      row.appendChild(b2);
    }
    document.body.appendChild(bg);
  });
}
function openDrawer(){ $("drawerBg").classList.add("show"); $("drawer").classList.add("open"); }
function closeDrawer(){ $("drawerBg").classList.remove("show"); $("drawer").classList.remove("open"); }
function dayName(ymd){
  try {
    const [y,m,d] = String(ymd).split("-").map(Number);
    const dt = new Date(y, m-1, d);

function listFuturePendingDays(){

  const out = [];
  Object.keys(db||{}).forEach(k => {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
    if (k <= t0) return;
    const dayObj = db[k];
    if (!dayObj || !dayObj.sheets) return;
    let tot = 0;
    dayObj.sheets.forEach(s => tot += sheetTotal(s));
    if (tot > 0) out.push({ date:k, total:tot });
  });
  out.sort((a,b)=>a.date.localeCompare(b.date));
  return out;
}

function primaryShops(s){

/** Shop-wise totals for current sheet (and label type). */
function shopSummary(s){
  const map = {};
  function add(list, type){
    list.forEach(o => {
      const name = (o.shopName || "—").trim() || "—";
      if (!map[name]) map[name] = { sweets:0, fc:0, other:0 };
      map[name][type]++;
    });
  }
  add(s.sweets||[], "sweets");
  add(s.fc||[], "fc");
  add(s.other||[], "other");
  return map;
}

async function saveSpecialNote(){
  if (viewingHistory()){ popup("Read-only", "History view cannot be edited."); return; }
  ensureDayLocal();
  let note = ($("specialNote") && $("specialNote").value) || "";
  const looksEnglish = note && /[A-Za-z]{3,}/.test(note) && !/[\u0600-\u06FF]{3,}/.test(note);
  if (looksEnglish) {
    setStatus("Converting note to Urdu…");
    try {
      const key = await fetchApiKey();
      const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method:"POST",
        headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+key },
        body: JSON.stringify({
          model: cachedModel || DEFAULT_MODEL,
          temperature: 0.1,
          max_tokens: 400,
          messages: [
            { role:"system", content: "Translate the user note to clear Urdu script only. No English. Keep meaning. Output only Urdu text." },
            { role:"user", content: note }
          ]
        })
      });
      const data = await res.json();
      if (res.ok) {
        const out = (data.choices?.[0]?.message?.content||"").trim();
        if (out) note = out;
      }
    } catch(e) { console.warn(e); }
  }
  db[day].specialNote = note;
  if ($("specialNote")) $("specialNote").value = note;
  saveDb();
  render();
  setStatus("Special note saved");
}

  return `<div class="sheet-summary">

function filterSheet(s, mode){

    fc: mode === "fc" ? (s.fc||[]) : [],
    other: mode === "other" ? (s.other||[]) : []
  };
}

function buildSheetHtml(s, idx, totalSheets, mode){
  const f = filterSheet(s, mode || "all");

  const n = parts.length;

    ? `<div class="cols ${colsClass}">${parts.join("")}</div>`

  if (!editRef || !confirm("Delete?")) return;
  const o = curSheet()[editRef.side][editRef.i];
  pushAudit("DELETE", (o.shopName||"") + " · " + (o.qty||"") + " · " + (o.detailUrdu||"").slice(0,80));
  curSheet()[editRef.side].splice(editRef.i,1);
  saveDb(); closeModal(); render();
}

function placeOrder(item, side){
  if (viewingHistory()){ setStatus("History read-only — Current slot pe switch karein"); return; }
  ensureDay();
  const max = maxPerSheet();
  if (!["sweets","fc","other"].includes(side)) side = "other";
  let s = curSheet();
  if (sheetTotal(s) >= max) { newSheet(); s = curSheet(); }
  s[side].push(item);
  saveDb();
}
function normalize(o, type){
  return {
    shopName: o.shopName || "—",
    customerName: o.customerName || "—",
    nameOnCakeEn: o.nameOnCakeEn || "",
    nameOnCakeUr: o.nameOnCakeUr || "",
    qty: o.qty || "—",
    flavour: o.flavour || "",
    rateNote: o.rateNote || "",
    detailUrdu: o.detailUrdu || "",
    delivery: o.delivery || "",
    type: o.type || type,
    createdAt: o.createdAt || Date.now()
  };
}
function addManual(side){
  const shop = prompt("Shop (English):",""); if (shop===null) return;
  const name = prompt("Name:","");
  const qty = prompt("Qty:", side==="other" ? "—" : "1 kg");
  const flavour = side==="other" ? "" : (prompt("Flavour:","")||"");
  const detail = prompt(side==="other" ? "Special note:" : "Tafseel Urdu:","")||"";
  placeOrder(normalize({ shopName:shop, customerName:name, qty, flavour, detailUrdu:detail }, side), side);
  render();
}

const SYSTEM = `You are bakery order desk AI for Pakistan (Hafiz-style order slips).
User text may be Roman Urdu, Urdu, or English. Understand meaning.

Return ONLY JSON:
{
  "orders": [
    {
      "side": "fc" | "sweets" | "other",
      "shopName": "English",
      "customerName": "",
      "nameOnCakeEn": "English name",
      "nameOnCakeUr": "Urdu name if given",
      "qty": "5 KG or 5 Pound",
      "flavour": "",
      "rateNote": "",
      "delivery": "delivery date/time only if customer mentioned, else empty",
      "detailUrdu": "description without shop name; qty first then other lines"
    }
  ]
}

RULES:
1) shopName is English and belongs in shopName only — never put shop name inside detailUrdu.
2) detailUrdu: start with quantity (5 KG / 5 Pound) then remaining customer details. No shop name in detail.
3) nameOnCakeEn = English; nameOnCakeUr = Urdu form if available. Show both when possible.
4) If customer gives delivery date/time, put ONLY in delivery field (not as entry timestamp).
5) Butter cake/cream → flavour Butter + rateNote "Rate Rs.1500 per pound".
6) side: fc = cream/F.C./butter cream cake; sweets = mithai; other = jam/note/misc.
7) Keep detail short and faithful.
`;

async function aiAdd(){
  const raw = $("raw").value.trim();
  if (!raw) return popup("Empty", "Please paste or type an order first.");
  setStatus("Loading AI key…");
  try {
    const key = await fetchApiKey();
    setStatus("MrCrazy AI…");
    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+key },
      body: JSON.stringify({
        model: cachedModel || DEFAULT_MODEL,
        temperature: 0.15,
        max_tokens: 1400,
        messages: [
          { role:"system", content: SYSTEM },
          { role:"user", content: raw }
        ]
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || ("HTTP "+res.status));
    let text = (data.choices?.[0]?.message?.content||"").trim()
      .replace(/^```json/i,"").replace(/^```/,"").replace(/```$/,"").trim();
    const parsed = JSON.parse(text);
    const list = Array.isArray(parsed.orders) ? parsed.orders : [];
    list.forEach(o => {
      let side = (o.side||"").toLowerCase();
      if (side !== "fc" && side !== "sweets" && side !== "other") {
        if (/cream|f\.?c/i.test(o.type||"")) side = "fc";
        else if (/jam|note|other|special/i.test(o.type||o.detailUrdu||"")) side = "other";
        else side = "sweets";
      }
      placeOrder(normalize(o, side), side);
    });
    $("raw").value = "";
    render();
    setStatus("Added");
  } catch(e) {
    cachedKey = "";
    setStatus("Error"); popup("AI error", String(e.message||e));
  }
}

function printCurrent(){
  if (isFutureDay(day)) {
    popup("Print blocked", "Future pending orders cannot be printed.");
    return;
  }
  window.print();
}

/** mode: all | fc | other | sweets — alag print ya ikhatta */
function printMode(mode){
  ensureDayLocal();
  if (isFutureDay(day)) {
    popup("Print blocked", "This date is in the future. Pending orders cannot be printed until that day.");
    return;
  }
  const area = $("printArea");
  const all = activeSheets() || [];
  const filtered = [];
  all.forEach(s => {
    const f = filterSheet(s, mode);
    if (sheetTotal(f) > 0) filtered.push(f);
  });
  if (!filtered.length) {
    setStatus("No orders for filter: " + mode); popup("Nothing to print", "No orders match this filter.");
    return;
  }
  area.innerHTML = filtered.map((s,i)=>buildSheetHtml(s, i, filtered.length, mode)).join("");
  setTimeout(() => {
    window.print();
    render();
  }, 120);
}
function exportPdf(){
  if (isFutureDay(day)) {
    popup("PDF blocked", "Future pending orders cannot be exported as PDF.");
    return;
  }
  printMode("all");
}

function printDay(){ printMode("all"); }
function exportDay(){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(db[day],null,2)],{type:"application/json"}));
  a.download = "orders-"+day+".json"; a.click();
}
